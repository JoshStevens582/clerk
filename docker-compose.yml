# Clerk: web (Caddy + React) -> api (FastAPI + SQLite).
# Local smoke test: ports 8090/8444 on web.
services:
  api:
    build: .
    container_name: clerk-api
    mem_limit: 1024m
    env_file: .env
    environment:
      CORS_ORIGINS: ""
    volumes:
      - clerk-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/api/ready')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 8
    networks:
      - default
      - cca-edge
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: clerk-web
    mem_limit: 256m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "8090:80"
      - "8444:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - cca-edge
    restart: unless-stopped

networks:
  cca-edge:
    name: cca-edge
    external: true

volumes:
  clerk-data:
  caddy-data:
  caddy-config:
